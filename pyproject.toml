[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "linexiong-rewardhack"
version = "0.1.0"
description = "查找输出中迎合评分格式、堆砌关键词、回避难题等模式并定位"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "linexiong" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://linexiong.github.io"
Repository = "https://github.com/linexiong/rewardhack"
Issues = "https://github.com/linexiong/rewardhack/issues"

[project.scripts]
rewardhack = "rewardhack:main"

[tool.setuptools]
py-modules = ["rewardhack"]
